name: kinta
description: App Kinta

publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  window_manager: ^0.5.1
  intl: ^0.20.2
  image_picker: ^1.2.2
  signature: ^6.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.6
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_launcher_icons: "^0.13.1"

  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png" # Ruta a tu imagen (recomendado 1024x1024 px)
  # Opcional para Android adaptativo:
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/icon/icon.png"  